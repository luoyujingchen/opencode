name: fangcode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  fangcode:
    if: |
      contains(github.event.comment.body, ' /fangcode') ||
      startsWith(github.event.comment.body, '/fangcode') ||
      contains(github.event.comment.body, ' /fang') ||
      startsWith(github.event.comment.body, '/fang')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run FangCode
        uses: anomalyco/fangcode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          FANG_API_KEY: ${{ secrets.FANG_API_KEY || secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.FANG_API_KEY || secrets.OPENCODE_API_KEY }}
          FANG_PERMISSION: '{"bash": "deny"}'
          OPENCODE_PERMISSION: '{"bash": "deny"}'
        with:
          model: opencode/claude-opus-4-5
